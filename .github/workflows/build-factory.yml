name: Build ESP32 Factory

on:
  push:
    branches: [main]
    paths:
      - "factory/**"
      - "partitions/**"
      - "tools/validate_partitions.py"
      - "tools/ESP32-Auto-Flasher.bat"
      - "tools/README.md"
      - ".github/workflows/build-factory.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate partition layouts
        run: python tools/validate_partitions.py

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install esptool dependency
        run: python -m pip install pyserial

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9

      - name: Install libraries
        run: |
          set -euo pipefail
          arduino-cli lib update-index
          arduino-cli lib install "AsyncTCP@1.1.4"
          arduino-cli lib install "ESPAsyncWebServer@3.1.0"
          arduino-cli lib install "ElegantOTA@3.1.0"

      - name: Build both Factory images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          ESP32_ROOT="$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.9"
          BOOT_APP0="$ESP32_ROOT/tools/partitions/boot_app0.bin"
          ESPTOOL="$(find "$HOME/.arduino15/packages/esp32/tools/esptool_py" -type f -name esptool.py -print -quit)"
          test -s "$BOOT_APP0"
          test -s "$ESPTOOL"

          for layout in basic extended; do
            STAGE="$RUNNER_TEMP/$layout/factory"
            BUILD="$RUNNER_TEMP/build-$layout"
            mkdir -p "$STAGE"
            cp factory/factory.ino "$STAGE/factory.ino"
            cp "partitions/$layout.csv" "$STAGE/partitions.csv"

            arduino-cli compile \
              --fqbn esp32:esp32:esp32 \
              --build-path "$BUILD" \
              "$STAGE"

            APP="$BUILD/factory.ino.bin"
            BOOTLOADER="$BUILD/factory.ino.bootloader.bin"
            PARTITIONS="$BUILD/factory.ino.partitions.bin"
            test -s "$APP"
            test -s "$BOOTLOADER"
            test -s "$PARTITIONS"

            if [ "$layout" = "basic" ]; then
              SLOT_SIZE=$((0x140000))
            else
              SLOT_SIZE=$((0x1F0000))
            fi

            APP_SIZE="$(stat -c%s "$APP")"
            if [ "$APP_SIZE" -gt "$SLOT_SIZE" ]; then
              echo "::error::Factory app ($APP_SIZE bytes) exceeds $layout OTA slot ($SLOT_SIZE bytes)"
              exit 1
            fi

            python "$ESPTOOL" --chip esp32 merge_bin \
              --target-offset 0x0 \
              -o "dist/factory-$layout.bin" \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 "$BOOTLOADER" \
              0x8000 "$PARTITIONS" \
              0xE000 "$BOOT_APP0" \
              0x10000 "$APP"

            cp "$PARTITIONS" "dist/partitions-$layout.bin"
            echo "$layout: app=$APP_SIZE bytes, slot=$SLOT_SIZE bytes"
          done

          cp "$BOOT_APP0" dist/boot_app0.bin
          cp tools/ESP32-Auto-Flasher.bat dist/ESP32-Auto-Flasher.bat
          cp tools/README.md dist/README-flasher.md
          mkdir -p dist/partitions
          cp partitions/basic.csv partitions/extended.csv dist/partitions/
          (cd dist && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Upload Factory bundle
        uses: actions/upload-artifact@v4
        with:
          name: esp32-factory-4mb
          path: dist/
          if-no-files-found: error
          retention-days: 30
